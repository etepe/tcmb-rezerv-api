name = "tcmb-rezerv-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Faz 1-2 yapılandırması (env/var). Secret ayrı: `wrangler secret put TCMB_EVDS_KEY`.
[vars]
WEEKLY_TTL = "21600"            # haftalık cache TTL (~6 saat) — /api/weekly
DAILY_TTL = "3600"              # günlük/summary cache TTL (~1 saat) — /api/summary
STALE_TTL = "1209600"           # son-bilinen-iyi fallback TTL (~14 gün) — EVDS bakım/kesintisinde sunulur
DEFAULT_WEEKLY_START = "01-10-2025"
YABANCI_MB_FALLBACK = "16.4"    # Yabancı MB swap fallback (mlr USD) — DOVVARNC.K18 çekilemezse (Faz 5)
EMAIL_TO = "tepe.erdinc@gmail.com,erdinc.tepe@bgcg.com"   # Faz 10 — dağıtım listesi (virgüllü; hepsi DOĞRULANMIŞ hedef)
EMAIL_FROM = "rezerv@tqrlab.com"     # Faz 10 — gönderen (tqrlab.com Email Routing domain'inde adres)
EMAIL_LANG = "both"                  # Faz 10 — mail dili: en | tr | both
EMAIL_CRON = "30 5,12 * * 1-5"       # Faz 10 — mail tetiği; [triggers].crons'taki üçüncü girdiyle AYNI olmalı

# KV cache. id'yi `wrangler kv namespace create REZERV_CACHE` çıktısıyla doldur.
[[kv_namespaces]]
binding = "REZERV_CACHE"
id = "7cadc8955a4647eb9b2f35fc40a032a7"
# preview_id = "REPLACE_WITH_PREVIEW_KV_ID"   # `wrangler dev` için (opsiyonel)

# Faz 10 — Cloudflare Email Service gönderim binding'i (M-006, src/email.ts).
# Doğrulanmış hedef adrese gönderim her planda ÜCRETSİZDİR; API anahtarı/secret gerekmez.
# Tek seferlik ön koşul (dashboard): tqrlab.com'da Email Routing etkin + hedef adres doğrulanmış.
[[send_email]]
name = "EMAIL_SENDER"
# İzin listesi: binding YALNIZ bu adreslere gönderebilir (EMAIL_TO ile eş tutulmalı).
allowed_destination_addresses = ["tepe.erdinc@gmail.com", "erdinc.tepe@bgcg.com"]

# Faz 4 — Cron ön-ısıtma (M-005, src/scheduled.ts). Saatler UTC (TR = UTC+3).
# scheduled() handler summary + weekly cache anahtarını (UI'nin düştüğü anahtarlar)
# tazeler → kullanıcı (ve CI smoke) hep SICAK cache'e düşer. Public sözleşme DEĞİŞMEZ.
# DİKKAT — Workers Free: hesap başına TOPLAM 5 cron tetiği (kod 10072); diğer worker'larla
# paylaşılır. Bu yüzden warm cron'ları TEK girdide birleşik tutulur (bu worker toplam 2 girdi):
#   "0 8,12,16,17 * * 1-5" : hafta içi 08/12/16 UTC = 11/15/19 TR — analitik bilanço / iş günü
#                            (A02/A10/USD) yayımını yakalar. HAFTALIK brüt rezerv baskısı
#                            PERŞEMBE 14:30 TRT = 11:30 UTC'dir (önceki Cuma'ya ait) → 12 UTC
#                            ayağı bunu 30 dk sonra yakalar; 16/17 UTC ayakları ekstra tazelik.
#   "30 5,12 * * 1-5"      : hafta içi 05:30+12:30 UTC = 08:30+15:30 TR — günlük rezerv-akışı
#                            maili (Faz 10; EMAIL_CRON ile eşleşir → scheduled() maile yönlendirir).
[triggers]
crons = ["0 8,12,16,17 * * 1-5", "30 5,12 * * 1-5"]
